<!DOCTYPE html>
<html lang="en">
<head>
<!-- Three.js r128 (global THREE build) from a public CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gunfright - Three.js Isometric</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1a110c; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; font-family:Georgia,'Times New Roman',serif; }
  #gl { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#fff3d6; text-shadow:0 2px 0 rgba(60,30,10,.85); }
  #title { position:absolute; left:calc(14px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top));
    font-size:18px; letter-spacing:3px; font-weight:bold; }
  #left { display:block; font-size:13px; letter-spacing:1px; opacity:.9; margin-top:2px; }
  #gridBtn { pointer-events:auto; position:absolute; right:calc(14px + env(safe-area-inset-right));
    top:calc(10px + env(safe-area-inset-top)); width:44px; height:44px; border-radius:50%;
    border:2px solid rgba(255,243,214,.6); background:rgba(40,20,8,.35); color:#fff3d6; font-size:20px; }
  #pad { pointer-events:auto; position:absolute; left:calc(22px + env(safe-area-inset-left));
    bottom:calc(22px + env(safe-area-inset-bottom)); width:144px; height:144px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, rgba(255,243,214,.24), rgba(60,30,10,.38));
    border:2px solid rgba(255,243,214,.5); touch-action:none; }
  #pad .a { position:absolute; font-size:15px; opacity:.55; }
  #pad .u { left:50%; top:6px; transform:translateX(-50%); }
  #pad .d { left:50%; bottom:6px; transform:translateX(-50%); }
  #pad .l { left:9px; top:50%; transform:translateY(-50%); }
  #pad .r { right:9px; top:50%; transform:translateY(-50%); }
  #knob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%;
    background:rgba(255,243,214,.88); box-shadow:0 4px 0 rgba(60,30,10,.6); will-change:transform; }
  #fire { pointer-events:auto; display:none; position:absolute; right:calc(26px + env(safe-area-inset-right));
    bottom:calc(26px + env(safe-area-inset-bottom)); width:116px; height:116px; border-radius:50%;
    align-items:center; justify-content:center; font-size:22px; font-weight:bold; letter-spacing:2px;
    color:#fff3d6; background:radial-gradient(circle at 50% 35%, #e0573a, #8a2514);
    border:3px solid rgba(255,243,214,.7); box-shadow:0 6px 0 rgba(60,20,8,.7); touch-action:none; }
  #msg { position:absolute; left:0; right:0; top:24%; text-align:center; font-size:clamp(34px, 9vw, 84px);
    font-weight:bold; letter-spacing:4px; opacity:0; transform:scale(.92); transition:opacity .15s, transform .15s; }
  #msg.show { opacity:1; transform:scale(1); }
  #msg.red { color:#ff6a4d; }
  #sub { display:block; font-size:clamp(15px, 3.6vw, 26px); letter-spacing:2px; margin-top:6px; opacity:.9; }
  .bar { position:absolute; left:0; right:0; height:0; background:#000; transition:height .5s ease; }
  #barT { top:0; } #barB { bottom:0; }
  body.duel .bar { height:11%; }
  body.duel #pad { display:none; }
  body.duel #fire { display:flex; }
  body.duel #gridBtn { display:none; }
</style>
</head>
<body>
<div id="hud">
  <div id="title">GUNFRIGHT<span id="left"></span></div>
  <button id="gridBtn" title="Toggle grid">&#9638;</button>
  <div id="msg"></div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <div id="pad"><span class="a u">&#9650;</span><span class="a d">&#9660;</span><span class="a l">&#9664;</span><span class="a r">&#9654;</span><div id="knob"></div></div>
  <div id="fire">FIRE</div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIG - everything you are likely to tweak lives here
   ===================================================================== */
const CFG = {
  gridW: 24, gridH: 23,            // tiles (x runs down-right, z runs down-left)
  playerSpeed: 4.2,                // tiles / second
  playerRadius: 0.28,
  viewHeight: 9,                   // world units visible vertically (landscape)
  minViewWidth: 13,                // world units kept visible horizontally (portrait phones)
  maxPixelRatio: 2,
  sky: 0xf0c89c,
  fogNear: 100, fogFar: 165,                  // iso camera sits ~104 units from the focus point
  sunColor: 0xffa24f, sunIntensity: 0.80,   // late-afternoon sun
  ambColor: 0xd7a58e, ambIntensity: 0.46,
  tiltBlurPx: 7, tiltFocus: 0.24,           // tilt-shift: max blur radius (px) and sharp band half-height
  vignette: 0.32,
  triggerRadius: 4.3,              // tiles: how close before a duel starts
};
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const SHADOW_RES = isMobile ? 1536 : 2048;

/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
const SQ = Math.SQRT1_2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const lerpAngle = (a, b, t) => {
  const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
};
function mulberry(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry(1886);

/* =====================================================================
   RENDERER, SCENE, CAMERAS
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;                    // full shadow mapping
renderer.shadowMap.type = THREE.PCFSoftShadowMap;     // soft shadow edges
renderer.domElement.id = 'gl';
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.sky);
scene.fog = new THREE.Fog(CFG.sky, CFG.fogNear, CFG.fogFar);

// True isometric: the camera sits on the (1,1,1) diagonal (distance = CAM_D * sqrt(3)), looking at the focus point.
const CAM_D = 60;
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
const fpCam = new THREE.PerspectiveCamera(40, 1, 0.1, 200);   // duel camera
let activeCam = ortho;
let viewH = CFG.viewHeight;
let zoom = 1;
const focus = { x: 12.5, z: 6.5 };

/* =====================================================================
   POST-PROCESSING: render to a (multisampled) target, then one fullscreen
   pass does tilt-shift blur + warm grade + vignette + flash.
   ===================================================================== */
const rtOpts = { format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
                 minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
const hasGL2 = !!renderer.capabilities.isWebGL2;
const rt = hasGL2 ? new THREE.WebGLMultisampleRenderTarget(4, 4, rtOpts)
                  : new THREE.WebGLRenderTarget(4, 4, rtOpts);
if (hasGL2) rt.samples = 4;

const U = {
  tDiffuse: { value: rt.texture },
  uTexel: { value: new THREE.Vector2(1, 1) },
  uBlur: { value: CFG.tiltBlurPx },
  uFocus: { value: CFG.tiltFocus },
  uVignette: { value: CFG.vignette },
  uFlash: { value: new THREE.Color(1, 1, 1) },
  uFlashAmt: { value: 0 },
};
const postMat = new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform vec2 uTexel;
    uniform float uBlur, uFocus, uVignette, uFlashAmt;
    uniform vec3 uFlash;
    void main() {
      // Tilt-shift: no blur in a horizontal band across the middle, growing toward top/bottom.
      float d = abs(vUv.y - 0.5);
      float radius = uBlur * smoothstep(uFocus, 0.5, d);
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      if (radius > 0.4) {
        vec3 sum = col; float tot = 1.0;
        for (int i = 0; i < 12; i++) {
          float fi = float(i);
          float a = fi * 2.39996323;                 // golden-angle disc
          float r = sqrt((fi + 0.5) / 12.0);
          sum += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * r * radius * uTexel).rgb;
          tot += 1.0;
        }
        col = sum / tot;
      }
      // warm desert grade
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, 1.14);
      col = (col - 0.5) * 1.07 + 0.5;
      col *= vec3(1.03, 1.0, 0.94);
      float v = smoothstep(0.35, 0.85, length(vUv - 0.5) * 1.2);
      col *= 1.0 - v * uVignette;
      col = mix(col, uFlash, uFlashAmt);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const postScene = new THREE.Scene();
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
postQuad.frustumCulled = false;
postScene.add(postQuad);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ---------- resize: high-DPI aware, keeps the iso view framed on any aspect ---------- */
let pixelRatio = Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio);
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h);
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(size.x, size.y);
  U.uTexel.value.set(1 / size.x, 1 / size.y);
  const aspect = w / h;
  viewH = Math.max(CFG.viewHeight, CFG.minViewWidth / aspect);   // portrait phones zoom out a bit
  ortho.left = -viewH * aspect / 2; ortho.right = viewH * aspect / 2;
  ortho.top = viewH / 2; ortho.bottom = -viewH / 2;
  ortho.updateProjectionMatrix();
  fpCam.aspect = aspect; fpCam.updateProjectionMatrix();
}

/* =====================================================================
   LIGHTING: warm ambient + strong low sun with soft shadow maps
   ===================================================================== */
scene.add(new THREE.AmbientLight(CFG.ambColor, CFG.ambIntensity));
const sun = new THREE.DirectionalLight(CFG.sunColor, CFG.sunIntensity);
const MAPC = { x: CFG.gridW / 2, z: CFG.gridH / 2 };
sun.position.set(MAPC.x - 20, 12, MAPC.z + 7);       // low sun from the west => long shadows toward +x
sun.target.position.set(MAPC.x, 0, MAPC.z);
sun.castShadow = true;
sun.shadow.mapSize.set(SHADOW_RES, SHADOW_RES);
Object.assign(sun.shadow.camera, { left: -23, right: 23, top: 23, bottom: -23, near: 1, far: 90 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* =====================================================================
   TOON MATERIALS (cel shading through a stepped gradient ramp)
   ===================================================================== */
const rampVals = [76, 76, 133, 184, 235, 255];
const rampData = new Uint8Array(rampVals.length * 4);
rampVals.forEach((v, i) => rampData.set([v, v, v, 255], i * 4));
const gradientMap = new THREE.DataTexture(rampData, rampVals.length, 1, THREE.RGBAFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.generateMipmaps = false;
gradientMap.needsUpdate = true;

const toonCache = new Map();
const toon = hex => {
  if (!toonCache.has(hex)) toonCache.set(hex, new THREE.MeshToonMaterial({ color: hex, gradientMap }));
  return toonCache.get(hex);
};
const edgeMat = new THREE.LineBasicMaterial({ color: 0x2b1a12, transparent: true, opacity: 0.5 });
const unitBox = new THREE.BoxGeometry(1, 1, 1);

function mesh(geo, hex, opts = {}) {
  const m = new THREE.Mesh(geo, toon(hex));
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  return m;
}
function box(w, h, d, hex, x, y, z, parent, opts) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), hex, opts);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
const addEdges = m => m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat));

/* =====================================================================
   GRID + WORLD DATA
   ===================================================================== */
const W = CFG.gridW, H = CFG.gridH;
const solid = [], road = [];
for (let z = 0; z < H; z++) {
  solid.push(new Uint8Array(W));
  road.push(new Uint8Array(W));
  for (let x = 0; x < W; x++) {
    road[z][x] = ((z >= 8 && z <= 10) || (z >= 18 && z <= 20) || (x >= 11 && x <= 13)) ? 1 : 0;
  }
}
const markSolid = (x, z, w, d) => {
  for (let j = z; j < z + d; j++) for (let i = x; i < x + w; i++) {
    if (j >= 0 && j < H && i >= 0 && i < W) solid[j][i] = 1;
  }
};
const BUILDINGS = [
  { name: 'SALOON',        x: 2,  z: 2,  w: 6, d: 5, h: 3.0, body: 0xc4673f, roof: 0x6b4129, front: 1.1, porch: true,  awning: 0x8a3b24 },
  { name: 'BANK',          x: 15, z: 2,  w: 6, d: 5, h: 3.4, body: 0xe0b983, roof: 0x7a5636, front: 0.9, porch: false },
  { name: 'STABLE',        x: 1,  z: 12, w: 5, d: 5, h: 2.3, body: 0x9a6b3f, roof: 0x5a3a24, gable: true },
  { name: 'GENERAL STORE', x: 7,  z: 12, w: 3, d: 5, h: 2.6, body: 0xd49a6a, roof: 0x6b4129, front: 0.7, porch: true,  awning: 0x5c7a8c },
  { name: 'HOTEL',         x: 15, z: 12, w: 7, d: 5, h: 3.9, body: 0xb85a38, roof: 0x6b4129, front: 0.8, porch: true,  awning: 0x8a3b24 },
];
BUILDINGS.forEach(b => markSolid(b.x, b.z, b.w, b.d));
markSolid(9, 3, 2, 2);   // water tower

/* ---------- ground texture (painted procedurally, then lit by the sun) ---------- */
function makeGroundTexture() {
  const S = 1024, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const sx = S / W, sz = S / H;
  g.fillStyle = '#d6ae76'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 700; i++) {                       // large soft blotches
    g.fillStyle = `rgba(${150 + rand() * 60 | 0},${108 + rand() * 50 | 0},${68 + rand() * 40 | 0},${0.05 + rand() * 0.08})`;
    const r = 12 + rand() * 46;
    g.beginPath(); g.ellipse(rand() * S, rand() * S, r, r * 0.7, rand() * 3, 0, 6.283); g.fill();
  }
  // contact shadows / ambient occlusion under each building
  g.save();
  g.shadowColor = 'rgba(70,40,22,0.55)'; g.shadowBlur = 30;
  g.fillStyle = '#c9a06a';
  BUILDINGS.forEach(b => g.fillRect(b.x * sx, b.z * sz, b.w * sx, b.d * sz));
  g.restore();
  // roads with a soft dusty shoulder
  g.save();
  g.shadowColor = 'rgba(156,112,70,0.6)'; g.shadowBlur = 38;
  g.fillStyle = '#b98b59';
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) if (road[z][x]) g.fillRect(x * sx, z * sz, sx + 0.5, sz + 0.5);
  g.restore();
  g.strokeStyle = 'rgba(118,80,48,0.38)'; g.lineWidth = 3;     // wheel ruts
  const rut = (x0, z0, x1, z1) => {
    g.beginPath(); g.moveTo(x0 * sx, z0 * sz);
    const n = 40;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      g.lineTo(lerp(x0, x1, t) * sx + (rand() - 0.5) * 2, lerp(z0, z1, t) * sz + (rand() - 0.5) * 2);
    }
    g.stroke();
  };
  [9.22, 9.78, 19.22, 19.78].forEach(zz => rut(0, zz, W, zz));
  [12.22, 12.78].forEach(xx => rut(xx, 0, xx, H));
  for (let i = 0; i < 7000; i++) {                       // grit
    const t = rand();
    g.fillStyle = t < 0.5 ? 'rgba(110,76,46,0.22)' : 'rgba(240,214,164,0.22)';
    g.fillRect(rand() * S, rand() * S, 1 + rand() * 2.2, 1 + rand() * 2.2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

const worldGroup = new THREE.Group();
scene.add(worldGroup);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, H),
  new THREE.MeshToonMaterial({ map: makeGroundTexture(), gradientMap }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(W / 2, 0, H / 2);
ground.receiveShadow = true;
worldGroup.add(ground);

const farGround = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), toon(0xd2aa72));
farGround.rotation.x = -Math.PI / 2;
farGround.position.set(W / 2, -0.02, H / 2);
farGround.receiveShadow = true;
worldGroup.add(farGround);

/* ---------- optional grid overlay (button top-right) ---------- */
const gridLines = (() => {
  const pts = [];
  for (let x = 0; x <= W; x++) pts.push(x, 0.03, 0, x, 0.03, H);
  for (let z = 0; z <= H; z++) pts.push(0, 0.03, z, W, 0.03, z);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const l = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x3a1f10, transparent: true, opacity: 0.16 }));
  l.visible = false;
  worldGroup.add(l);
  return l;
})();
$('gridBtn').addEventListener('click', () => { gridLines.visible = !gridLines.visible; });

/* ---------- sign textures ---------- */
function signTexture(text, bg, fg) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(8, 8, 496, 112);
  let size = 64;
  x.font = `bold ${size}px Georgia,serif`;
  while (x.measureText(text).width > 450 && size > 20) { size -= 4; x.font = `bold ${size}px Georgia,serif`; }
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

/* ---------- buildings: stylised low-poly blocks ---------- */
const winMats = { glass: toon(0x2a2530), frame: toon(0xf0dcb0) };
const winInst = { glass: [], frame: [] };   // collected, then drawn as two InstancedMeshes
function queueBox(list, x, y, z, sx, sy, sz) {
  list.push({ x, y, z, sx, sy, sz });
}

function addBuilding(b) {
  const cx = b.x + b.w / 2, cz = b.z + b.d / 2, zf = b.z + b.d;   // zf = front (+z) face
  const grp = new THREE.Group();
  worldGroup.add(grp);

  box(b.w + 0.14, 0.26, b.d + 0.14, 0x8a7358, cx, 0.13, cz, grp);                // stone plinth
  const body = box(b.w, b.h, b.d, b.body, cx, b.h / 2, cz, grp);
  addEdges(body);

  if (b.gable) {                                                                  // gabled roof (extruded triangle)
    const hw = b.w / 2 + 0.25, rise = 1.3, s = new THREE.Shape();
    s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(0, rise); s.closePath();
    const roof = mesh(new THREE.ExtrudeGeometry(s, { depth: b.d + 0.5, bevelEnabled: false }), b.roof);
    roof.position.set(cx, b.h, b.z - 0.25);
    grp.add(roof);
  } else {
    box(b.w + 0.3, 0.24, b.d + 0.3, b.roof, cx, b.h + 0.12, cz, grp);             // flat roof slab
  }
  if (b.front) {                                                                  // western false front
    box(b.w, b.front, 0.35, b.body, cx, b.h + 0.24 + b.front / 2, zf - 0.175, grp);
    box(b.w + 0.2, 0.16, 0.5, b.roof, cx, b.h + 0.24 + b.front + 0.08, zf - 0.2, grp);
  }

  const sign = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(b.w * 0.7, 3.4), 0.62),
    new THREE.MeshBasicMaterial({ map: signTexture(b.name, '#3b2417', '#f3d9a0') }));
  sign.position.set(cx, b.front ? b.h + 0.24 + b.front / 2 : 2.1, zf + 0.04);
  grp.add(sign);

  box(0.95, 1.65, 0.12, 0x4a2f1b, cx, 0.26 + 0.82, zf + 0.03, grp, { cast: false });   // door

  const cols = Math.floor(b.w / 1.8);
  const rows = b.h >= 3.3 ? [1.55, 3.0] : [1.55];
  for (let i = 0; i < cols; i++) {
    const wx = b.x + (b.w / (cols + 1)) * (i + 1);
    if (Math.abs(wx - cx) < 1.0) continue;
    rows.forEach(wy => {
      queueBox(winInst.frame, wx, wy, zf + 0.01, 0.9, 1.05, 0.08);
      queueBox(winInst.glass, wx, wy, zf + 0.03, 0.66, 0.82, 0.08);
    });
  }
  const colsX = Math.floor(b.d / 1.8);
  for (let i = 0; i < colsX; i++) {
    const wz = b.z + (b.d / (colsX + 1)) * (i + 1);
    rows.forEach(wy => {
      queueBox(winInst.frame, b.x + b.w + 0.01, wy, wz, 0.08, 1.05, 0.9);
      queueBox(winInst.glass, b.x + b.w + 0.03, wy, wz, 0.08, 0.82, 0.66);
    });
  }

  if (b.porch) {                                                                  // boardwalk, posts, awning
    const pd = 0.95;
    box(b.w, 0.12, pd, 0x8a6238, cx, 0.06, zf + pd / 2, grp);
    const awn = box(b.w, 0.1, pd + 0.15, b.awning || 0x6b4129, cx, 2.05, zf + pd / 2 + 0.05, grp);
    awn.rotation.x = 0.1;

const pad = { x: 0, y: 0, id: null };
const padEl = $('pad'), knob = $('knob');
function padUpdate(e) {
  const r = padEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2 - 14;
  let vx = (e.clientX - cx) / max, vy = (e.clientY - cy) / max;
  const len = Math.hypot(vx, vy);
  if (len > 1) { vx /= len; vy /= len; }
  const dead = 0.14;
  pad.x = len < dead ? 0 : vx;
  pad.y = len < dead ? 0 : vy;
  knob.style.transform = `translate(${vx * max * 0.62}px, ${vy * max * 0.62}px)`;
}
const padReset = () => { pad.id = null; pad.x = pad.y = 0; knob.style.transform = 'translate(0px, 0px)'; };
padEl.addEventListener('pointerdown', e => {
  e.preventDefault(); pad.id = e.pointerId;
  if (padEl.setPointerCapture) padEl.setPointerCapture(e.pointerId);
  padUpdate(e);
});
padEl.addEventListener('pointermove', e => { if (e.pointerId === pad.id) { e.preventDefault(); padUpdate(e); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
  padEl.addEventListener(t, e => { if (e.pointerId === pad.id) padReset(); }));

/* =====================================================================
   MOVEMENT (grid-space dx/dy -> world X/Z) with tile collision
   ===================================================================== */
function blocked(x, z) {
  const r = CFG.playerRadius;
  if (x < r + 0.2 || z < r + 0.2 || x > W - r - 0.2 || z > H - r - 0.2) return true;
  const x0 = Math.floor(x - r), x1 = Math.floor(x + r), z0 = Math.floor(z - r), z1 = Math.floor(z + r);
  for (let j = z0; j <= z1; j++) for (let i = x0; i <= x1; i++) if (solid[j][i]) return true;
  return false;
}

function updatePlayer(dt) {
  let ix = pad.x, iy = pad.y;
  if (!ix && !iy) {
    const k = kb(); const l = Math.hypot(k.x, k.y) || 1;
    ix = k.x / l; iy = k.y / l;
  }
  // screen-space stick -> iso grid axes (screen up = -x,-z)
  const gx = (ix + iy) * SQ, gy = (iy - ix) * SQ;
  const ox = player.x, oz = player.z;
  const wantX = gx * CFG.playerSpeed * dt, wantZ = gy * CFG.playerSpeed * dt;
  if (!blocked(player.x + wantX, player.z)) player.x += wantX;       // axis-separated => slides along walls
  if (!blocked(player.x, player.z + wantZ)) player.z += wantZ;
  player.dx = player.x - ox;                                         // grid delta actually applied
  player.dy = player.z - oz;
  // grid delta -> Three.js X / Z offsets
  playerRig.g.position.x += player.dx;
  playerRig.g.position.z += player.dy;

  player.speed = Math.hypot(player.dx, player.dy) / Math.max(dt, 1e-4);
  player.moving = player.speed > 0.4;
  if (player.moving) player.facing = lerpAngle(player.facing, Math.atan2(player.dx, player.dy), Math.min(1, dt * 14));
  player.anim += dt * (player.moving ? 11 : 0);
}

/* =====================================================================
   ANIMATION of rigs
   ===================================================================== */
function animatePlayer(t) {
  const r = playerRig;
  r.root.rotation.y = player.facing;
  const s = player.moving ? Math.sin(player.anim) : 0;
  r.legs[0].rotation.x = s * 0.7; r.legs[1].rotation.x = -s * 0.7;
  r.armL.rotation.x = -s * 0.5; r.armR.rotation.x = s * 0.4;
  r.root.position.y = player.moving ? Math.abs(s) * 0.05 : Math.sin(t * 2) * 0.008;
  r.root.rotation.x = player.moving ? 0.07 : 0;
}
function animateBandit(b, t, dt) {
  const r = b.rig;
  if (b.alive || mode === 'result' || mode === 'outro') {
    const near = Math.hypot(player.x - b.x, player.z - b.z);
    if (b !== duel.bandit && near < 9) b.facing = lerpAngle(b.facing, Math.atan2(player.x - b.x, player.z - b.z), Math.min(1, dt * 3));
  }
  r.root.rotation.y = b.facing;
  const drawing = b === duel.bandit && (mode === 'draw' || (mode === 'result' && !duel.win));
  if (b === duel.bandit && (mode === 'draw' || mode === 'result' || mode === 'outro')) {
    if (drawing) b.armT = Math.min(1, b.armT + dt / 0.13);
    r.armR.rotation.x = -Math.PI / 2 * 0.96 * ease(b.armT);
    if (duel.win) b.fall = Math.min(1, b.fall + dt / 0.6);
  } else {
    r.armR.rotation.x = 0.05; r.armL.rotation.x = 0;
  }
  const f = ease(b.fall);
  r.root.rotation.x = -Math.PI / 2 * 0.97 * f;                       // topple backwards
  r.root.position.y = lerp(Math.sin(t * 1.6 + b.seed) * 0.01, 0.22, f);
  if (r.flash) {
    b.flash = Math.max(0, b.flash - dt * 6);
    r.flash.material.opacity = b.flash;
  }
}

/* =====================================================================
   DUST PARTICLES (point sprites, GPU-shaded)
   ===================================================================== */
const MAXD = 90;
const dPos = new Float32Array(MAXD * 3), dVel = new Float32Array(MAXD * 3);
const dLife = new Float32Array(MAXD).fill(1), dSize = new Float32Array(MAXD);
const dAge = new Float32Array(MAXD).fill(99), dMax = new Float32Array(MAXD).fill(1);
let dCursor = 0, dustTimer = 0;
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dustGeo.setAttribute('aLife', new THREE.BufferAttribute(dLife, 1));
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dSize, 1));
const dustU = { uScale: { value: 40 }, uColor: { value: new THREE.Color(0xdcbc8c) } };
const dust = new THREE.Points(dustGeo, new THREE.ShaderMaterial({
  uniforms: dustU, transparent: true, depthWrite: false,
  vertexShader: `
    attribute float aLife; attribute float aSize;
    varying float vLife; uniform float uScale;
    void main() {
      vLife = aLife;
      gl_PointSize = min(aSize * uScale * (0.7 + 1.1 * aLife), 96.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying float vLife; uniform vec3 uColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.12, d) * (1.0 - vLife) * 0.55;
      if (a < 0.01) discard;
      gl_FragColor = vec4(uColor, a);
    }`,
}));
dust.frustumCulled = false;
dust.renderOrder = 2;
scene.add(dust);

function emitDust(x, z, vx, vz) {
  const i = dCursor; dCursor = (dCursor + 1) % MAXD;
  dPos[i * 3] = x + (rand() - 0.5) * 0.25; dPos[i * 3 + 1] = 0.1; dPos[i * 3 + 2] = z + (rand() - 0.5) * 0.25;
  dVel[i * 3] = -vx * 0.3 + (rand() - 0.5) * 0.5;
  dVel[i * 3 + 1] = 0.35 + rand() * 0.4;
  dVel[i * 3 + 2] = -vz * 0.3 + (rand() - 0.5) * 0.5;
  dAge[i] = 0; dMax[i] = 0.55 + rand() * 0.45; dSize[i] = 0.3 + rand() * 0.22;
}
function updateDust(dt) {
  if (mode === 'explore' && player.moving && !solid[Math.floor(player.z)][Math.floor(player.x)]) {
    dustTimer -= dt;
    if (dustTimer <= 0) {
      dustTimer = 0.055;
      const vx = player.dx / dt, vz = player.dy / dt;
      emitDust(player.x, player.z, vx, vz);
      if (road[Math.floor(player.z)][Math.floor(player.x)]) emitDust(player.x, player.z, vx, vz);   // roads kick up more
    }
  }
  for (let i = 0; i < MAXD; i++) {
    if (dAge[i] >= dMax[i]) { dLife[i] = 1; continue; }
    dAge[i] += dt;
    const damp = 1 - dt * 2.2;
    dVel[i * 3] *= damp; dVel[i * 3 + 1] *= damp; dVel[i * 3 + 2] *= damp;
    dPos[i * 3] += dVel[i * 3] * dt; dPos[i * 3 + 1] += dVel[i * 3 + 1] * dt; dPos[i * 3 + 2] += dVel[i * 3 + 2] * dt;
    dLife[i] = Math.min(dAge[i] / dMax[i], 1);
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aLife.needsUpdate = true;
  dustGeo.attributes.aSize.needsUpdate = true;
}

/* =====================================================================

   ===================================================================== */
function startDuel(b) {
  mode = 'intro';
  duel.bandit = b; duel.t = 0; duel.win = false; duel.shake = 0;
  b.armT = 0; b.fall = 0; b.flash = 0;
  b.facing = Math.atan2(player.x - b.x, player.z - b.z);
  padReset();
  player.moving = false;
  document.body.classList.add('duel');
  showMsg('Outlaw!', '', true);
}

function enterFirstPerson() {
  const b = duel.bandit;
  activeCam = fpCam;
  dust.visible = false;
  playerRig.g.visible = false;
  duel.fov = duel.fovTarget = 42;
  mode = 'wait'; duel.t = 0;
  duel.waitFor = 1.3 + rand() * 1.9;
  duel.windowMs = lerp(900, 450, b.difficulty);
  duel.flashAmt = 0.9; U.uFlash.value.setRGB(1, 1, 1);
  vignetteTarget = 0.6; focusBandTarget = 0.18; blurTarget = CFG.tiltBlurPx * 1.4;
  showMsg('STEADY...', '', false);
}

function fire() {
  if (mode === 'wait') {
    if (duel.t < 0.3) return;                                   // ignore the tap that was still travelling in
    endDuel(false, 'TOO EARLY!', 'You jumped the gun');
  } else if (mode === 'draw') {
    const ms = Math.round(performance.now() - duel.drawAt);
    endDuel(true, 'GOT HIM!', ms + ' ms');
  }
}

function endDuel(win, title, sub) {
  mode = 'result'; duel.t = 0; duel.win = win;
  duel.shake = 1;
  duel.flashAmt = 0.75;
  U.uFlash.value.setRGB(win ? 1 : 0.85, win ? 0.95 : 0.15, win ? 0.8 : 0.1);
  duel.fovTarget = 30;
  if (!win) duel.bandit.flash = 1;
  showMsg(title, sub, !win);
}

function leaveDuel() {
  const b = duel.bandit;
  mode = 'outro'; duel.t = 0;
  activeCam = ortho;
  dust.visible = true;
  playerRig.g.visible = true;
  document.body.classList.remove('duel');
  hideMsg();
  vignetteTarget = CFG.vignette; focusBandTarget = CFG.tiltFocus; blurTarget = CFG.tiltBlurPx;
  if (!duel.win) {                                              // defeated: back to the edge of town
    player.x = START.x; player.z = START.z;
    playerRig.g.position.set(player.x, 0, player.z);
    b.armT = 0; b.fall = 0;
  }
  duel.outroFrom = { x: focus.x, z: focus.z, zoom };   // ease out from wherever the zoom-in ended
}

function updateDuel(dt) {
  const b = duel.bandit;
  duel.t += dt;
  if (mode === 'intro') {
    const k = ease(clamp(duel.t / 1.15, 0, 1));
    focus.x = lerp(player.x, b.x, k * 0.55);
    focus.z = lerp(player.z, b.z, k * 0.55);
    zoom = lerp(1, 3.0, k);
    blurTarget = CFG.tiltBlurPx * (1 + k * 0.6);
    vignetteTarget = lerp(CFG.vignette, 0.5, k);
    if (duel.t >= 1.15) enterFirstPerson();
  } else if (mode === 'wait') {
    duel.fovTarget = lerp(42, 34, clamp(duel.t / duel.waitFor, 0, 1));    // slow dramatic push-in
    if (duel.t >= duel.waitFor) {
      mode = 'draw';
      duel.drawAt = performance.now();
      duel.fov = 24; duel.fovTarget = 32; duel.shake = 0.35;
      showMsg('DRAW!', '', true);
    }
  } else if (mode === 'draw') {
    if (performance.now() - duel.drawAt > duel.windowMs) endDuel(false, 'TOO SLOW!', 'He shot first');
  } else if (mode === 'result') {
    if (duel.t > 1.8) leaveDuel();
  } else if (mode === 'outro') {
    const k = ease(clamp(duel.t / 0.9, 0, 1));
    focus.x = lerp(duel.outroFrom.x, player.x, k);
    focus.z = lerp(duel.outroFrom.z, player.z, k);
    zoom = lerp(duel.outroFrom.zoom, 1, k);
    if (duel.t >= 0.9) {
      mode = 'explore'; zoom = 1;
      if (duel.win) { b.alive = false; b.rig.g.visible = false; updateLeft(); }
      duel.bandit = null;
      if (!bandits.some(x => x.alive)) { showMsg('TOWN CLEARED', 'Nice shootin\'', false); setTimeout(hideMsg, 3200); }
    }
  }
  // first-person camera
  if (b && activeCam === fpCam) {
    duel.fov += (duel.fovTarget - duel.fov) * Math.min(1, dt * (mode === 'draw' ? 9 : 3));
    fpCam.fov = duel.fov; fpCam.updateProjectionMatrix();
    duel.shake = Math.max(0, duel.shake - dt * 2.2);
    const dx = b.x - player.x, dz = b.z - player.z, len = Math.hypot(dx, dz) || 1;
    const sh = duel.shake * 0.07;
    fpCam.position.set(player.x - dx / len * 0.8 + (rand() - 0.5) * sh, 1.55 + (rand() - 0.5) * sh, player.z - dz / len * 0.8 + (rand() - 0.5) * sh);
    fpCam.lookAt(b.x, lerp(1.1, 0.35, ease(b.fall)), b.z);
  }
}

/* =====================================================================
   FRAME LOOP
   ===================================================================== */
let last = 0, tAcc = 0, frames = 0, fpsAcc = 0, lastAdjust = 0;
function updateCameras(dt) {
  if (mode === 'explore') {
    const f = Math.min(1, dt * 6);
    focus.x += (player.x - focus.x) * f; focus.z += (player.z - focus.z) * f;
  }
  const fy = 0.9;
  ortho.position.set(focus.x + CAM_D, CAM_D + fy, focus.z + CAM_D);
  ortho.lookAt(focus.x, fy, focus.z);
  ortho.zoom = zoom;
  ortho.updateProjectionMatrix();
}

function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min((now - last) / 1000, 1);
  last = now;
  const dt = Math.min(raw, 0.05);
  tAcc += dt;

  if (mode === 'explore') {
    updatePlayer(dt);
    for (const b of bandits) {
      if (b.alive && Math.hypot(player.x - b.x, player.z - b.z) < CFG.triggerRadius) { startDuel(b); break; }
    }
  } else {
    player.moving = false; player.dx = player.dy = 0;
    updateDuel(dt);
  }
  animatePlayer(tAcc);
  bandits.forEach(b => animateBandit(b, tAcc, dt));
  updateCameras(dt);
  updateDust(Math.max(dt, 1e-3));

  // smooth post uniforms
  const s = Math.min(1, dt * 4);
  U.uVignette.value += (vignetteTarget - U.uVignette.value) * s;
  U.uFocus.value += (focusBandTarget - U.uFocus.value) * s;
  const blurPx = blurTarget * pixelRatio;
  U.uBlur.value += (blurPx - U.uBlur.value) * s;
  duel.flashAmt = Math.max(0, duel.flashAmt - dt * 2.4);
  U.uFlashAmt.value = duel.flashAmt;

  // dust point size = pixels per world unit
  dustU.uScale.value = (rt.height || 1) / (viewH / ortho.zoom);

  renderer.setRenderTarget(rt);
  renderer.render(scene, activeCam);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);

  // adaptive resolution: drop pixel ratio if the device struggles
  fpsAcc += raw; frames++;
  if (frames >= 90) {
    const fps = frames / fpsAcc; frames = 0; fpsAcc = 0;
    if (fps < 42 && pixelRatio > 1 && now - lastAdjust > 2500) {
      pixelRatio = Math.max(1, pixelRatio - 0.25); lastAdjust = now; resize();
    }
  }
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();
requestAnimationFrame(t => { last = t; frame(t); });

// handy for poking around in the console
window.GF = { player, bandits, startDuel, fire, CFG, get mode() { return mode; } };
})();
</script>
</body>
</html>
